name: PR title

# Squash merges make the pull request title the commit message on main.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/run-pinned.sh cog verify "$PR_TITLE"
