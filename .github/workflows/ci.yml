name: CI

# Pushes to main are checked by the Deploy workflow, which calls this one before it publishes.
on:
  pull_request:
  workflow_call:
    inputs:
      publish-site:
        description: Upload the checked dist/ as the GitHub Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    name: check-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - name: Install the browser for the accessibility checks
        run: vp exec playwright install --with-deps chromium-headless-shell
      - name: Run every guardrail
        run: vp run check:all
      # The site that passed the checks is the one that ships: no second build.
      - name: Upload the checked site for GitHub Pages
        if: inputs.publish-site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
